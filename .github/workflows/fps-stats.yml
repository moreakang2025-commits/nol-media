name: fps-stats
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    paths: ["fps/stats.txt"]
permissions:
  contents: write
concurrency:
  group: fps-stats
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests
      - name: Collect channel stats (read-only)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/fps/stats.py && python3 tools/fps/analyze.py
      - name: Save result
        if: always()
        run: |
          git config user.name "fps-bot"; git config user.email "fps-bot@users.noreply.github.com"
          git add fps/results || true; git commit -m "fps: stats" || true
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
