name: mongki-fix

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "episode id"
        default: "ep01"
      video_id:
        description: "YouTube video id"
        required: true
      thumb:
        description: "remake + set thumbnail"
        default: "true"
      captions:
        description: "add English CC track"
        default: "true"

permissions:
  contents: write

jobs:
  thumb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pillow numpy requests
      - name: Fonts
        timeout-minutes: 3
        run: |
          mkdir -p mongki/assets/fonts
          curl -fsSL --max-time 60 -o mongki/assets/fonts/Anton-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf || true
      - name: Remake and set thumbnail
        if: github.event.inputs.thumb == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/mongki/rethumb.py mongki/episodes/${{ github.event.inputs.episode }}.json ${{ github.event.inputs.video_id }}
      - name: Add captions
        if: github.event.inputs.captions == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/mongki/addcaptions.py mongki/episodes/${{ github.event.inputs.episode }}.json ${{ github.event.inputs.video_id }}
      - name: Save
        if: always()
        run: |
          git config user.name "mongki-bot"
          git config user.email "mongki-bot@users.noreply.github.com"
          git add mongki/results || true
          git commit -m "mongki: new thumbnail for ${{ github.event.inputs.episode }}" || echo "nothing"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done || true
