name: fps-video
# Front Porch Stories episode. fps/run.txt first line: "<episode> <upload true|false> <US publish date YYYY-MM-DD|-> [full|shorts]"
#   full   = build + upload long-form (10:00 ET) + 4 Shorts (12:30/15:30/18:30/20:30 ET)
#   shorts = long-form already uploaded: rebuild from cache, upload only the Shorts and (re)schedule the long-form
on:
  workflow_dispatch:
    inputs:
      episode: {description: "fps/episodes/<id>.txt", default: "ep01"}
      upload: {description: "upload to YouTube as private", default: "true"}
      max_lines: {description: "test: only the first N lines (blank = whole episode)", default: ""}
      date: {description: "US publish date YYYY-MM-DD (blank = stay private)", default: ""}
      mode: {description: "full or shorts", default: "full"}
  push:
    paths: ["fps/run.txt"]
permissions:
  contents: write
concurrency:
  group: fps-video
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Python packages and ffmpeg
        timeout-minutes: 5
        run: |
          pip install -q pillow numpy requests imageio-ffmpeg
          FF=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          mkdir -p $HOME/bin && ln -sf "$FF" $HOME/bin/ffmpeg && echo "$HOME/bin" >> $GITHUB_PATH
          "$FF" -version | head -1
      - name: Fonts
        timeout-minutes: 3
        run: |
          mkdir -p mongki/assets/fonts
          curl -fsSL --max-time 60 -o mongki/assets/fonts/Anton-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf
          curl -fsSL --max-time 60 -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip || true
          if [ -f /tmp/inter.zip ]; then
            unzip -q -o /tmp/inter.zip -d /tmp/inter
            sudo mkdir -p /usr/share/fonts/opentype/inter
            sudo cp /tmp/inter/extras/otf/InterDisplay-Bold.otf /tmp/inter/extras/otf/Inter-Regular.otf /usr/share/fonts/opentype/inter/ || true
          fi
      - name: Pick episode
        id: ep
        run: |
          EP="${{ github.event.inputs.episode }}"; [ -z "$EP" ] && EP=$(head -n1 fps/run.txt | awk '{print $1}')
          UP="${{ github.event.inputs.upload }}"; [ -z "$UP" ] && UP=$(head -n1 fps/run.txt | awk '{print $2}')
          DATE=$(head -n1 fps/run.txt | awk '{print $3}'); MODE=$(head -n1 fps/run.txt | awk '{print $4}')
          [ -n "${{ github.event.inputs.episode }}" ] && DATE="${{ github.event.inputs.date }}" && MODE="${{ github.event.inputs.mode }}"
          [ "$DATE" = "-" ] && DATE=""; [ -z "$MODE" ] && MODE=full
          echo "id=$EP" >> $GITHUB_OUTPUT; echo "upload=${UP:-true}" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT; echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "at=$(python3 tools/fps/when.py "$DATE" long)" >> $GITHUB_OUTPUT
          echo "episode=$EP upload=$UP date=$DATE mode=$MODE"
      - name: Restore voice and picture cache
        uses: actions/cache/restore@v4
        with:
          path: fps/cache
          key: fps-cache-${{ github.run_id }}
          restore-keys: fps-cache-
      - name: Build episode
        timeout-minutes: 200
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FPS_JOBS: "3"
          FPS_IMAGE_MODEL: gemini-2.5-flash-image   # $0.039/image (3.1 flash image is $0.067)
          FPS_SPLIT: "20"                           # a new picture at least every ~20 s
        run: |
          ML="${{ github.event.inputs.max_lines }}"
          python3 tools/fps/build.py fps/episodes/${{ steps.ep.outputs.id }}.txt out/fps_${{ steps.ep.outputs.id }} ${ML:+--max-lines $ML}
      - name: Save voice and picture cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fps/cache
          key: fps-cache-${{ github.run_id }}
      - name: Upload to YouTube (private, scheduled if a date is given)
        if: steps.ep.outputs.upload == 'true' && steps.ep.outputs.mode == 'full'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/fps/upload.py out/fps_${{ steps.ep.outputs.id }} "${{ steps.ep.outputs.at }}"
      - name: Shorts-only mode - reuse and (re)schedule the uploaded long-form
        if: steps.ep.outputs.upload == 'true' && steps.ep.outputs.mode == 'shorts'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          E=${{ steps.ep.outputs.id }}; cp fps/results/${E}_upload.json out/fps_$E/upload.json
          if [ -n "${{ steps.ep.outputs.date }}" ]; then
            V=$(python3 -c "import json;print(json.load(open('fps/results/${E}_upload.json'))['video_id'])")
            echo "schedule $V ${{ steps.ep.outputs.date }} long" > /tmp/fix.txt
            cp /tmp/fix.txt fps/fix.txt && python3 tools/fps/fix.py && git checkout -- fps/fix.txt 2>/dev/null || true
          fi
      - name: Build Shorts (from the long-form voice and pictures, no extra cost)
        id: shorts
        continue-on-error: true
        timeout-minutes: 40
        run: python3 tools/fps/shorts.py out/fps_${{ steps.ep.outputs.id }} 4
      - name: Upload Shorts (private)
        if: steps.ep.outputs.upload == 'true' && steps.shorts.outcome == 'success'
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          O=out/fps_${{ steps.ep.outputs.id }}
          LONG=$(python3 -c "import json;print(json.load(open('$O/upload.json')).get('url',''))" 2>/dev/null || true)
          for d in $O/shorts/*/; do k=$(basename $d)
            LONG_URL="$LONG" python3 tools/fps/upload.py "$d" "$(python3 tools/fps/when.py '${{ steps.ep.outputs.date }}' $k)" || true; done
      - name: Keep the files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fps_${{ steps.ep.outputs.id }}
          path: |
            out/fps_${{ steps.ep.outputs.id }}/video.mp4
            out/fps_${{ steps.ep.outputs.id }}/thumb.jpg
            out/fps_${{ steps.ep.outputs.id }}/transcript.txt
            out/fps_${{ steps.ep.outputs.id }}/meta.json
            out/fps_${{ steps.ep.outputs.id }}/upload.json
            out/fps_${{ steps.ep.outputs.id }}/audio_qa.json
            out/fps_${{ steps.ep.outputs.id }}/shots/
          retention-days: 14
      - name: Record result in the repo
        if: always()
        run: |
          E=${{ steps.ep.outputs.id }}; O=out/fps_$E; mkdir -p fps/results
          for f in meta.json upload.json audio_qa.json thumb.jpg contact.jpg; do [ -f $O/$f ] && cp $O/$f fps/results/${E}_$f || true; done
          for d in $O/shorts/*/; do [ -d "$d" ] || continue; k=$(basename $d)
            for f in meta.json upload.json; do [ -f $d$f ] && cp $d$f fps/results/${E}_${k}_$f || true; done
            [ -f $d/upload.json ] && python3 -c "import json,sys;v=json.load(open('$d/upload.json')).get('video_id');ids=json.load(open('fps/results/fps_ids.json')) if __import__('os').path.exists('fps/results/fps_ids.json') else [];v and v not in ids and ids.append(v);json.dump(ids,open('fps/results/fps_ids.json','w'),indent=1)" || true
          done
          python3 - "$O/upload.json" <<'PY' || true
          import json, os, sys
          p = "fps/results/fps_ids.json"; ids = json.load(open(p)) if os.path.exists(p) else []
          v = json.load(open(sys.argv[1])).get("video_id")
          if v and v not in ids: ids.append(v)
          json.dump(ids, open(p, "w"), indent=1)
          PY
          git config user.name "fps-bot"; git config user.email "fps-bot@users.noreply.github.com"
          git add fps/results || true; git commit -m "fps: results for $E" || true
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done || true
