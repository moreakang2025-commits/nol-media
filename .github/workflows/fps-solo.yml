name: fps-solo
# Front Porch Stories standalone daily Short (owner decision 2026-11-24).
# fps/solo_run.txt first line: "<shNNN> <upload true|false> <US publish date YYYY-MM-DD>"  -> fps/shorts/shNNN.txt
# Builds the tiny story (same voices/pictures engine as the long-form), renders ONE vertical Short, uploads it
# private and scheduled at 18:30 ET (tools/fps/when.py ... solo). Results: fps/results/shNNN_*.
on:
  workflow_dispatch:
  push:
    paths: ["fps/solo_run.txt"]
permissions:
  contents: write
concurrency:
  group: fps-solo
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Python packages and ffmpeg
        timeout-minutes: 5
        run: |
          pip install -q pillow numpy requests imageio-ffmpeg edge-tts
          FF=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          mkdir -p $HOME/bin && ln -sf "$FF" $HOME/bin/ffmpeg && echo "$HOME/bin" >> $GITHUB_PATH
      - name: Fonts
        timeout-minutes: 3
        run: |
          mkdir -p mongki/assets/fonts
          curl -fsSL --max-time 60 -o mongki/assets/fonts/Anton-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf
          curl -fsSL --max-time 60 -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip || true
          if [ -f /tmp/inter.zip ]; then
            unzip -q -o /tmp/inter.zip -d /tmp/inter
            sudo mkdir -p /usr/share/fonts/opentype/inter
            sudo cp /tmp/inter/extras/otf/InterDisplay-Bold.otf /tmp/inter/extras/otf/Inter-Regular.otf /usr/share/fonts/opentype/inter/ || true
          fi
      - name: Pick Short
        id: ep
        run: |
          read -r SH UP DATE _ < <(head -n1 fps/solo_run.txt)
          echo "id=$SH" >> $GITHUB_OUTPUT; echo "upload=${UP:-true}" >> $GITHUB_OUTPUT; echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "at=$(python3 tools/fps/when.py "$DATE" solo)" >> $GITHUB_OUTPUT
          echo "short=$SH upload=$UP date=$DATE"
      - name: Restore voice and picture cache
        uses: actions/cache/restore@v4
        with:
          path: fps/cache
          key: fps-cache-${{ github.run_id }}
          restore-keys: fps-cache-
      - name: Build
        timeout-minutes: 60
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FPS_JOBS: "3"
          FPS_IMAGE_MODEL: gemini-2.5-flash-image
          FPS_SPLIT: "8"
        run: |
          python3 tools/fps/build.py fps/shorts/${{ steps.ep.outputs.id }}.txt out/fps_${{ steps.ep.outputs.id }}
          python3 tools/fps/shorts.py out/fps_${{ steps.ep.outputs.id }} 1
      - name: Upload (private, scheduled)
        if: steps.ep.outputs.upload == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/fps/upload.py out/fps_${{ steps.ep.outputs.id }}/shorts/s1 "${{ steps.ep.outputs.at }}"
      - name: Record result in the repo
        if: always()
        run: |
          E=${{ steps.ep.outputs.id }}; O=out/fps_$E; D=$O/shorts/s1; mkdir -p fps/results
          for f in engine.json contact.jpg audio_qa.json; do [ -f $O/$f ] && cp $O/$f fps/results/${E}_$f || true; done
          for f in meta.json upload.json; do [ -f $D/$f ] && cp $D/$f fps/results/${E}_$f || true; done
          [ -f $D/video.mp4 ] && ffmpeg -v error -y -ss 3 -i $D/video.mp4 -frames:v 1 -vf scale=540:-1 fps/results/${E}_frame.jpg || true
          python3 - "$D/upload.json" <<'PY' || true
          import json, os, sys
          p = "fps/results/fps_ids.json"; ids = json.load(open(p)) if os.path.exists(p) else []
          v = json.load(open(sys.argv[1])).get("video_id")
          if v and v not in ids: ids.append(v)
          json.dump(ids, open(p, "w"), indent=1)
          PY
          git config user.name "fps-bot"; git config user.email "fps-bot@users.noreply.github.com"
          git add fps/results fps/library || true; git commit -m "fps: results for $E" || true
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done || true
      - name: Save voice and picture cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fps/cache
          key: fps-cache-solo-${{ github.run_id }}
