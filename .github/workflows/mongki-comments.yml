name: mongki-comments

on:
  schedule:
    - cron: "41 21 * * *"   # 06:41 KST daily, before the ideation task
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: Collect comments
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 tools/mongki/comments.py
      - name: Save
        run: |
          git config user.name "mongki-bot"
          git config user.email "mongki-bot@users.noreply.github.com"
          git add mongki/ideas || true
          git commit -m "mongki: comments update" || echo "nothing to commit"
          git pull --rebase -q || true
          git push || true
