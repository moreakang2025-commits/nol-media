name: mongki-video

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "episode id (mongki/episodes/<id>.json)"
        default: "ep01"
      upload:
        description: "upload to YouTube as private"
        default: "true"
  push:
    paths:
      - "mongki/run.txt"

permissions:
  contents: write

concurrency:
  group: mongki-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python packages and ffmpeg
        timeout-minutes: 5
        run: |
          pip install -q pillow numpy requests imageio-ffmpeg
          FF=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          mkdir -p $HOME/bin && ln -sf "$FF" $HOME/bin/ffmpeg && echo "$HOME/bin" >> $GITHUB_PATH
          "$FF" -version | head -1
      - name: Fonts
        timeout-minutes: 3
        run: |
          mkdir -p mongki/assets/fonts
          curl -fsSL --max-time 60 -o mongki/assets/fonts/Anton-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf
          curl -fsSL --max-time 60 -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip || true
          if [ -f /tmp/inter.zip ]; then
            unzip -q -o /tmp/inter.zip -d /tmp/inter
            sudo mkdir -p /usr/share/fonts/opentype/inter
            sudo cp /tmp/inter/extras/otf/InterDisplay-Bold.otf /tmp/inter/extras/otf/Inter-Regular.otf /usr/share/fonts/opentype/inter/ || true
          fi
      - name: Pick episode
        id: ep
        run: |
          EP="${{ github.event.inputs.episode }}"
          if [ -z "$EP" ]; then EP=$(head -n1 mongki/run.txt | awk '{print $1}'); fi
          UP="${{ github.event.inputs.upload }}"
          if [ -z "$UP" ]; then UP=$(head -n1 mongki/run.txt | awk '{print $2}'); fi
          DAY=$(head -n1 mongki/run.txt | awk '{print $3}')
          echo "replace=$(head -n1 mongki/run.txt | awk '{print $4}')" >> $GITHUB_OUTPUT
          echo "shorts=$(head -n1 mongki/run.txt | awk '{print $5}')" >> $GITHUB_OUTPUT
          echo "day=$DAY" >> $GITHUB_OUTPUT
          echo "id=$EP" >> $GITHUB_OUTPUT
          echo "upload=${UP:-true}" >> $GITHUB_OUTPUT
      - name: Build video
        timeout-minutes: 60
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/mongki/build.py mongki/episodes/${{ steps.ep.outputs.id }}.json out/${{ steps.ep.outputs.id }}
      - name: Upload to YouTube (private)
        if: steps.ep.outputs.upload == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          REPLACE_VIDEO: ${{ steps.ep.outputs.replace != '-' && steps.ep.outputs.replace || '' }}
        run: |
          AT=""; [ -n "${{ steps.ep.outputs.day }}" ] && AT=$(python3 tools/mongki/schedule.py ${{ steps.ep.outputs.day }} long)
          python3 tools/mongki/upload.py out/${{ steps.ep.outputs.id }} "$AT"
      - name: Build Shorts
        id: shorts
        if: steps.ep.outputs.shorts != 'noshorts'
        continue-on-error: true
        timeout-minutes: 30
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/mongki/shorts.py mongki/episodes/${{ steps.ep.outputs.id }}.json out/${{ steps.ep.outputs.id }}
      - name: Upload Shorts
        if: steps.ep.outputs.upload == 'true' && steps.shorts.outcome == 'success'
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          n=0
          for d in out/${{ steps.ep.outputs.id }}/shorts/*/; do
            n=$((n+1)); AT=""
            [ -n "${{ steps.ep.outputs.day }}" ] && AT=$(python3 tools/mongki/schedule.py ${{ steps.ep.outputs.day }} short$n)
            python3 tools/mongki/upload.py "$d" "$AT" || true
          done
          LONG=$(python3 -c "import json;print(json.load(open('out/${{ steps.ep.outputs.id }}/upload.json')).get('video_id',''))" 2>/dev/null || true)
          SHORTS=$(for d in out/${{ steps.ep.outputs.id }}/shorts/*/; do python3 -c "import json;print(json.load(open('$d/upload.json')).get('video_id',''))" 2>/dev/null; done | tr '\n' ' ')
          if [ -n "$LONG" ] && [ -n "$SHORTS" ]; then cd tools/mongki && python3 linkshorts.py $LONG $SHORTS || true; fi
      - name: Keep the files for review
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ep.outputs.id }}
          path: |
            out/${{ steps.ep.outputs.id }}/video.mp4
            out/${{ steps.ep.outputs.id }}/thumb.jpg
            out/${{ steps.ep.outputs.id }}/captions.srt
            out/${{ steps.ep.outputs.id }}/transcript.txt
            out/${{ steps.ep.outputs.id }}/meta.json
            out/${{ steps.ep.outputs.id }}/data.json
            out/${{ steps.ep.outputs.id }}/upload.json
          retention-days: 14
      - name: Record result in the repo
        if: always()
        run: |
          mkdir -p mongki/results
          for f in meta.json data.json upload.json thumb_report.json audio_qa.json; do
            [ -f out/${{ steps.ep.outputs.id }}/$f ] && cp out/${{ steps.ep.outputs.id }}/$f mongki/results/${{ steps.ep.outputs.id }}_$f || true
          done
          for d in out/${{ steps.ep.outputs.id }}/shorts/*/; do
            [ -d "$d" ] || continue; k=$(basename "$d")
            for f in meta.json upload.json audio_qa.json; do
              [ -f "$d$f" ] && cp "$d$f" mongki/results/${{ steps.ep.outputs.id }}_${k}_$f || true
            done
          done
          [ -f out/${{ steps.ep.outputs.id }}/thumb.jpg ] && cp out/${{ steps.ep.outputs.id }}/thumb.jpg mongki/results/${{ steps.ep.outputs.id }}_thumb.jpg || true
          git config user.name "mongki-bot"
          git config user.email "mongki-bot@users.noreply.github.com"
          mkdir -p mongki/diag
          for f in voice_raw.flac voice_final.flac; do
            [ -f out/${{ steps.ep.outputs.id }}/$f ] && cp out/${{ steps.ep.outputs.id }}/$f mongki/diag/${{ steps.ep.outputs.id }}_$f || true
          done
          git add mongki/results mongki/diag mongki/cache || true
          git commit -m "mongki: results for ${{ steps.ep.outputs.id }}" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done || true
